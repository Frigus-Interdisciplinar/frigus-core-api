# Copie para secret.yaml, preencha os valores reais e nao versiona secret.yaml.
# Em producao, prefira External Secrets/Secrets Manager em vez deste arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: core-api-secrets
  namespace: frigus
type: Opaque
stringData:
  DATABASE_URL: jdbc:postgresql://SEU_HOST_SUPABASE:5432/postgres?sslmode=require
  DATABASE_USERNAME: SEU_USUARIO_SUPABASE
  DATABASE_PASSWORD: SUA_SENHA_SUPABASE
  REDIS_URL: rediss://default:SUA_SENHA@SEU_HOST_UPSTASH:6379
  JWT_SECRET: GERE_UM_SEGREDO_ALEATORIO_COM_PELO_MENOS_32_CARACTERES
  FRIGUS_AI_BASE_URL: https://SUA_URL_DO_SERVICO_AI
