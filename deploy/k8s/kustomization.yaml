apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frigus
resources:
  - namespace.yaml
  - configmap.yaml
  - bff-configmap.yaml
  - deployment.yaml
  - bff-deployment.yaml
  - service.yaml
  - bff-service.yaml
  - ingress.yaml
  - pdb.yaml
images:
  - name: frigus-core-api
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/frigus-core-api
    newTag: REPLACE_ME
  - name: frigus-bff
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/frigus-bff
    newTag: REPLACE_ME
