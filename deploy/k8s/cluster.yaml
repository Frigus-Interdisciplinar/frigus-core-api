apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: frigus-prod
  # Set this to the AWS Region you choose before creating the cluster.
  region: sa-east-1

iam:
  # Required for IAM Roles for Service Accounts (AWS Load Balancer Controller).
  withOIDC: true

managedNodeGroups:
  - name: app-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    volumeSize: 30
    privateNetworking: true
    labels:
      workload: frigus-apps

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
