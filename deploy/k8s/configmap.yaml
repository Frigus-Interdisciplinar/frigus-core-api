apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: frigus
data:
  SPRING_PROFILES_ACTIVE: aws
  AWS_REGION: ${AWS_REGION}
  AWS_S3_ENABLED: "false"
  APP_TIME_ZONE: America/Sao_Paulo
  APP_FRONTEND_URL: ${APP_FRONTEND_URL}
  SECURITY_ALLOWED_ORIGINS: ${FRONTEND_ORIGINS},https://${API_HOST}
  SECURITY_TRUSTED_PROXY_CIDRS: ${SECURITY_TRUSTED_PROXY_CIDRS}
  CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGINS}
  FRIGUS_AI_API_KEY_REQUIRED: "true"
  APP_SWAGGER_OPEN_ON_STARTUP: "false"
  FLYWAY_BASELINE_ON_MIGRATE: "false"
