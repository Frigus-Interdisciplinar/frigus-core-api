apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: frigus
data:
  SPRING_PROFILES_ACTIVE: aws
  AWS_REGION: us-east-1
  AWS_S3_ENABLED: "false"
  SECURITY_ALLOWED_ORIGINS: "https://${API_HOST},${FRONTEND_ORIGINS}"
  SECURITY_TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS}"
  FRIGUS_AI_API_KEY_REQUIRED: "true"
