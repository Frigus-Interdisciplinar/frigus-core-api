apiVersion: v1
kind: ConfigMap
metadata:
  name: core-api-config
  namespace: frigus
data:
  SPRING_PROFILES_ACTIVE: aws
  AWS_REGION: sa-east-1
  AWS_S3_ENABLED: "false"
  APP_TIME_ZONE: America/Sao_Paulo
  APP_FRONTEND_URL: https://app.seudominio.com
  SECURITY_ALLOWED_ORIGINS: https://app.seudominio.com
  CORS_ALLOWED_ORIGINS: https://app.seudominio.com
  FRIGUS_AI_API_KEY_REQUIRED: "true"
  APP_SWAGGER_OPEN_ON_STARTUP: "false"
  FLYWAY_BASELINE_ON_MIGRATE: "false"
