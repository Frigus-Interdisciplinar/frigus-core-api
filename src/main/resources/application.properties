spring.application.name=core-api
server.address=0.0.0.0
server.port=${PORT:8080}
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL}
management.health.redis.enabled=true
spring.session.store-type=redis

management.endpoint.health.access=unrestricted
jwt.secret=${JWT_SECRET}
jwt.expiration-time=${JWT_EXPIRATION:900000}

aws.region=${AWS_REGION:sa-east-1}

# Jobs de notificações: ambos executam uma vez por dia no fuso horário do servidor.
notifications.expiration.cron=${NOTIFICATIONS_EXPIRATION_CRON:0 0 9 * * *}
notifications.expiration.warning-days=${NOTIFICATIONS_EXPIRATION_WARNING_DAYS:3}
notifications.shopping-list-reminder.cron=${NOTIFICATIONS_SHOPPING_LIST_REMINDER_CRON:0 0 10 * * *}
notifications.shopping-list-reminder.delay-days=${NOTIFICATIONS_SHOPPING_LIST_REMINDER_DELAY_DAYS:3}


# Flyway runs before Hibernate validates the mapped schema.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:3}
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.mail.from=${SMTP_FROM:no-reply@frigus.local}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
