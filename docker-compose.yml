name: frigus-core-local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: frigus
      POSTGRES_USER: frigus
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-frigus-local-only}
    ports: ["127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigus -d frigus"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${LOCAL_REDIS_PORT:-56379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:${LOCAL_API_PORT:-8080}:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/frigus
      DATABASE_USERNAME: frigus
      DATABASE_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-frigus-local-only}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${LOCAL_JWT_SECRET:-local-development-only-frigus-secret-32-chars}
      JWT_EXPIRATION: 900000
      AWS_S3_ENABLED: "false"
      BREVO_API_URL: ${BREVO_API_URL:-https://api.brevo.com/v3}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Frigus}
      APP_FRONTEND_URL: ${LOCAL_FRONTEND_URL:-http://localhost:5173}
      FRIGUS_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:8000}
      APP_TIME_ZONE: America/Sao_Paulo
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
volumes:
  postgres-data:
  redis-data:
